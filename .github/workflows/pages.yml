# Публикация на GitHub Pages. Запускается только вручную:
# Actions → «Публикация на GitHub Pages» → Run workflow.
name: Публикация на GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # На сайт уходят только файлы приложения, без README и служебного.
      - name: Собрать сайт
        run: |
          mkdir _site
          cp -r index.html styles.css app.js imaging.js sw.js manifest.webmanifest icons _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
