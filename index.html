<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0e0e10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Split">
  <title>Split</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="app">
    <nav class="rail rail-left" aria-label="Формат">
      <button class="tool" type="button" data-frame="story" aria-label="Сторис 9:16">
        <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/></svg>
        <span>Сторис</span>
      </button>
      <button class="tool" type="button" data-frame="post" aria-label="Пост 4:5">
        <svg viewBox="0 0 24 24"><rect x="4.5" y="2.6" width="15" height="18.8" rx="2"/></svg>
        <span>Пост</span>
      </button>
    </nav>

    <section class="stage" id="stage">
      <div class="frame" id="frame">
        <div class="cells" id="cells"></div>
        <div class="line-dels" id="line-dels"></div>
        <div class="edit-layer" id="edit-layer" hidden></div>
      </div>
    </section>

    <nav class="rail rail-right" aria-label="Разделение">
      <button class="tool" type="button" data-tool="h" aria-label="Провести горизонтальную линию">
        <svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="m9 7 3-3 3 3M9 17l3 3 3-3" stroke-width="1.5"/></svg>
      </button>
      <button class="tool" type="button" data-tool="v" aria-label="Провести вертикальную линию">
        <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="m7 9-3 3 3 3M17 9l3 3-3 3" stroke-width="1.5"/></svg>
      </button>
      <div class="rail-sep"></div>
      <button class="tool" type="button" id="preview" aria-label="Предпросмотр без кнопок">
        <svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </nav>

    <footer class="bottom">
      <button class="round" id="undo" type="button" aria-label="Отменить" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button class="save" id="save" type="button">Сохранить</button>
      <button class="round" id="redo" type="button" aria-label="Вернуть" disabled>
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
    </footer>
  </main>

  <input class="picker" id="picker" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
  <div class="toast" id="toast" role="status"></div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card">
      <img id="sheet-img" alt="Готовый коллаж">
      <p class="sheet-hint">Коллаж готов</p>
      <div class="sheet-actions">
        <button class="ghost" id="sheet-close" type="button">Закрыть</button>
        <button class="save" id="sheet-save" type="button">Сохранить в Фото</button>
      </div>
    </div>
  </div>
</body>
</html>
